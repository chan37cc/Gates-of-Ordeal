<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="preload" as="image" href="img/open.webp" fetchpriority="high">
<link rel="preload" as="image" href="img/night.webp">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gates of Ordeal｜破局紀元：試煉之門</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: one-screen mobile game — title sequence → gate (login/register) → painted world map with the tower, balance plaque and dock; battles, boss warnings and panels open as layers. Single dark fantasy look by design. */
:root{
  --night:#080b14; --panel:#1c170e; --panel2:#0f0c07;
  --ink:#f3e8cc; --muted:#ab9e7e; --dim:#6f6754;
  --gold:#d4a446; --gold-hi:#f8e2a0; --gold-lo:#6e4b1e; --bronze:#3a2a14;
  --long:#46c37d; --short:#e5544a; --danger:#ff4040;
  --f-display:"Cinzel","Noto Serif TC",Georgia,serif;
  --f-title:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --grain:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#04060b;color:var(--ink);font-family:var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* 金屬框 */
.gild{position:relative;border:2px solid transparent;background:var(--grain),linear-gradient(#211a10,#0e0b07) padding-box,linear-gradient(140deg,#fff0bf,#8a5f22 22%,#e2b55a 45%,#5a3c14 70%,#f2d28a) border-box;background-blend-mode:overlay,normal,normal;box-shadow:inset 0 1px 0 #ffffff1c,inset 0 0 0 1px #000a,0 8px 22px #000c}
.gild::before{content:"";position:absolute;inset:4px;border-radius:inherit;border:1px solid #f8e2a02e;pointer-events:none}
.metal-text{background:linear-gradient(180deg,#fffaf0 0%,#f8e2a0 32%,#c99232 52%,#6b4413 54%,#e3b45a 76%,#fff1c0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--night);overflow:hidden;box-shadow:0 0 0 1px #000,0 0 80px #000}

/* ===== 主畫面：大理石、金框、深藍 ===== */
.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 12px 0}
.me{display:flex;align-items:center;gap:4px;min-width:0}
.av-wrap{position:relative;flex:none;width:74px;height:74px;display:grid;place-items:center}
.laurel{position:absolute;inset:-7px;pointer-events:none;filter:drop-shadow(0 2px 2px #5a3c1488)}
.laurel svg{width:100%;height:100%;display:block;overflow:visible}
.avatar{position:relative;width:60px;height:60px;padding:0;border-radius:50%;overflow:hidden;border:0;background:#2a1d08;box-shadow:0 0 0 2px #fff6d8,0 0 0 4px #d9ac4a,0 0 0 5px #7a5220,0 4px 8px #0006}
.avatar svg{width:100%;height:100%;display:block}
.me-side{min-width:0;display:grid;gap:5px;justify-items:start;margin-left:-4px}
.me-row{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.lvl{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:50%;display:grid;place-items:center;font:900 17px var(--f-display);color:#fdebb8;background:radial-gradient(circle at 40% 28%,#3c5cae,#17275c 70%,#0c173e);box-shadow:0 0 0 2px #e2b85a,0 0 0 3px #7a5220,0 2px 5px #0006;font-variant-numeric:tabular-nums}
.who,.me-row .name{min-width:0}
.me-row .name{font:900 15px var(--f-title);color:#1b2550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px #fff,0 0 10px #fff,0 1px 0 #fff}
.title-chip{font:900 13px var(--f-title);letter-spacing:.16em;padding:4px 14px 4px 16px;border-radius:6px;color:#fdebb8;background:linear-gradient(#2c4590,#15245a);box-shadow:0 0 0 2px #e2b85a,0 0 0 3px #7a5220,0 0 0 6px #fffaf0,0 0 0 7px #c9a04a,0 3px 6px #0005;white-space:nowrap}
.wallet{flex:none;position:relative;width:min(178px,46vw);aspect-ratio:2;margin:-12px -8px -6px 0;background:center/100% 100% no-repeat;filter:drop-shadow(0 3px 5px #0006)}
.wallet .wu{position:absolute;left:22.8%;top:59.4%;transform:translate(-50%,-50%);font:900 21px var(--f-display);color:#7a4c0c;text-shadow:0 1px 0 #fff3c4}
.wallet b{position:absolute;left:37%;right:19.5%;top:43.5%;height:32%;display:grid;place-items:center;font:800 17px var(--f-display);color:#fdf1cc;text-shadow:0 1px 0 #0b1436;font-variant-numeric:tabular-nums;white-space:nowrap}
.wallet .wplus{position:absolute;left:88.2%;top:59.4%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border:0;border-radius:50%;padding:0;background:none;color:#fff;font:900 19px/1 var(--f-display);cursor:pointer}
.wallet .wplus:focus-visible{outline:2px solid #fff}
.coin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 14px var(--f-display);color:#6a430c;background:radial-gradient(circle at 35% 30%,#fff6cf,#f0c25a 40%,#a8721f 80%);box-shadow:inset 0 0 0 2px #fbe6a4,inset 0 0 0 4px #b98226,0 1px 3px #0008}
.wallet.pulse b{animation:pf .8s}
@keyframes pf{40%{color:#fff;text-shadow:0 0 12px #ffd26a}}
.demo-bar{position:relative;z-index:2;margin:10px 12px 0;padding:6px 10px;border-radius:8px;font-size:11.5px;line-height:1.45;color:#f3e6c4;background:#15245ad9;box-shadow:0 0 0 1px #e2b85a}
.help-btn{position:relative;z-index:2;align-self:flex-end;margin:12px 16px 0 0;width:40px;height:40px;border-radius:50%;border:0;padding:0;background:none}
.help-btn::before{content:"";position:absolute;inset:-5px;background:linear-gradient(135deg,#fff0b8,#c8922e 55%,#7a5220);clip-path:polygon(50% 0,61% 22%,78% 22%,78% 39%,100% 50%,78% 61%,78% 78%,61% 78%,50% 100%,39% 78%,22% 78%,22% 61%,0 50%,22% 39%,22% 22%,39% 22%);filter:drop-shadow(0 2px 3px #0006)}
.help-btn span{position:absolute;inset:2px;border-radius:50%;display:grid;place-items:center;font:900 20px var(--f-display);color:#fdebb8;background:radial-gradient(circle at 40% 28%,#3c5cae,#17275c 70%,#0c173e);box-shadow:0 0 0 2px #e2b85a,0 0 0 3px #7a5220}
.fill{flex:1;min-height:0}
.rib{position:relative;z-index:2;align-self:center;margin-top:-34px;border:0;padding:5px 18px;border-radius:999px;font:900 12.5px var(--f-title);letter-spacing:.1em;color:#fdebb8;white-space:nowrap;background:linear-gradient(#2c4590,#15245a);box-shadow:0 0 0 2px #e2b85a,0 0 0 3px #7a5220,0 3px 8px #0006}

/* map：整個畫面就是神殿，其他介面疊在上面 */
.map{position:absolute;inset:0;z-index:0;background:#7ea4d4}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.map.intro canvas{animation:mapIn 1.6s cubic-bezier(.2,.7,.2,1)}
@keyframes mapIn{from{transform:scale(1.12);filter:brightness(1.5) blur(3px)}}

/* 進入試煉、水晶、層數牌 */
.enter{position:relative;z-index:2;align-self:center;border:0;padding:11px 40px 12px 46px;border-radius:999px;font:900 22px var(--f-title);letter-spacing:.3em;color:#fdebb8;text-shadow:0 2px 0 #0b1436;white-space:nowrap;
  background:radial-gradient(ellipse 70% 60% at 50% 0,#5a78c8aa,transparent 70%),linear-gradient(#2c4590,#14225a);
  box-shadow:0 0 0 2px #f0cc74,0 0 0 3.5px #7a5220,0 0 0 6px #fffaf0cc,0 6px 16px #0007,inset 0 2px 5px #ffffff40;animation:enterGlow 2.2s ease-in-out infinite}
@keyframes enterGlow{50%{box-shadow:0 0 0 2px #fff0b8,0 0 0 3.5px #7a5220,0 0 0 6px #fffaf0cc,0 6px 16px #0007,0 0 26px #ffe39a,inset 0 2px 5px #ffffff40}}
.enter::before,.enter::after{content:"✦";position:absolute;top:50%;transform:translateY(-52%);font-size:17px;letter-spacing:0;color:#fff3c8;text-shadow:0 0 8px #ffd978,0 0 2px #7a5220}
.enter::before{left:-9px}.enter::after{right:-9px}
.enter:active{transform:scale(.97)}
.enter.boss{background:radial-gradient(ellipse 70% 60% at 50% 0,#e07a6aaa,transparent 70%),linear-gradient(#8a2018,#4a0c0a)}
.enter.off{filter:grayscale(.6) brightness(.9);animation:none}
.gem{position:relative;z-index:2;align-self:center;width:66px;margin:2px 0 -6px;pointer-events:none;filter:drop-shadow(0 0 10px #6fc0ffcc)}
.gem svg{width:100%;height:auto;display:block;overflow:visible}
.gem-body{animation:gemBob 2.4s ease-in-out infinite}
@keyframes gemBob{50%{transform:translateY(-5px)}}
.gem-ring{transform-origin:30px 58px;animation:gemRing 2.4s ease-out infinite}
@keyframes gemRing{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.35);opacity:0}}
.plaque{position:relative;z-index:2;align-self:center;border:0;margin:0 0 6px;padding:8px 34px;border-radius:8px;font:900 16px var(--f-title);letter-spacing:.12em;color:#3a2a12;white-space:nowrap;
  background:repeating-linear-gradient(115deg,#0000 0 17px,#c9b99a33 17px 18px),linear-gradient(#fffdf8,#ece2d2);
  box-shadow:0 0 0 2px #d9ac4a,0 0 0 3px #7a5220,inset 0 0 0 1px #fff,inset 0 0 0 3px #e9cf8f88,0 5px 12px #0006}
.plaque::before,.plaque::after{content:"";position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;background:radial-gradient(circle at 40% 30%,#3c5cae,#17275c 70%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:none;outline:0;filter:drop-shadow(0 0 0 #e2b85a)}
.plaque::before{left:-14px}.plaque::after{right:-14px}
.plaque:active{filter:brightness(1.06)}

/* dock：四顆月桂框的圓形按鈕 */
.dock{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:10px 8px 12px}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:0;background:none;border:0}
.dock-btn .ico{position:relative;width:74px;height:74px;display:grid;place-items:center}
.dock-btn .ico::before{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 40% 26%,#4366bd,#17275c 68%,#0c173e);box-shadow:0 0 0 2px #fff6d8,0 0 0 4px #d9ac4a,0 0 0 5px #7a5220,0 4px 8px #0006,inset 0 3px 6px #ffffff33}
.dock-btn .ico>svg{position:relative;width:27px;height:27px;stroke:#fbe3a2;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 #0b1436)}
.dock-btn em{position:relative;margin-top:-6px;min-width:58px;padding:3px 9px 4px;border-radius:5px;font:900 13px var(--f-title);font-style:normal;letter-spacing:.06em;color:#3a2a12;white-space:nowrap;
  background:linear-gradient(#fffdf8,#ece2d2);box-shadow:0 0 0 1.5px #d9ac4a,0 0 0 2.5px #7a5220,inset 0 0 0 1px #fff,0 3px 6px #0005}
.dock-btn:active .ico{transform:scale(.94)}

/* 戰鬥 */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:#0a0d18 50% 30%/cover no-repeat;overflow-y:auto}
.b-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--grain),linear-gradient(#2c2416,#120e08);background-blend-mode:overlay,normal;border-bottom:2px solid #8a5f22}
.ghost{background:#0006;border:1px solid var(--gold-lo);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink)}
.b-floor{font:900 17px var(--f-title);letter-spacing:.06em;text-align:center}
.b-floor.boss{color:#ff6a5e;text-shadow:0 0 12px #ff2a2a88}
.b-bal{display:flex;align-items:center;gap:6px;font:800 14px var(--f-display);color:var(--gold-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.b-bal .coin{width:20px;height:20px;font-size:9px;box-shadow:inset 0 0 0 1px #fbe6a4,0 1px 2px #000}
.stage{position:relative;flex:none;height:clamp(230px,37vh,310px);display:flex;align-items:flex-end;justify-content:center;padding:36px 16px 14px;overflow:hidden}
.stage::before{content:"";position:absolute;left:50%;bottom:8px;width:min(64vw,250px);height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#000000b3 0%,#00000066 45%,transparent 70%);box-shadow:0 0 0 1.5px #f8e2a055,0 0 22px #ffcf7a44}
#battle.boss .stage::before{box-shadow:0 0 0 1.5px #ff6a5e88,0 0 26px #ff3a2a77}
.m-info{position:absolute;z-index:2;top:10px;left:16px;right:16px;display:flex;align-items:center;gap:10px}
.m-name{font:900 14px var(--f-title);white-space:nowrap;text-shadow:0 1px 2px #000,0 0 8px #000}
.hp{flex:1;height:11px;border-radius:2px;background:#000c;box-shadow:inset 0 0 0 1px #c99232,0 0 0 1px #000;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(#ffb1a1,#e2392b 45%,#8e130c);transition:width .12s linear}
.monster{position:relative;width:min(60vw,240px);height:min(60vw,240px);margin-bottom:-8px;filter:drop-shadow(0 6px 10px #000a) drop-shadow(0 0 18px #36c8ff55);animation:bob 2.6s ease-in-out infinite}
.monster.boss{width:min(70vw,285px);height:min(70vw,285px);margin-bottom:-14px;filter:drop-shadow(0 6px 10px #000a) drop-shadow(0 0 22px #ff5a4a66)}
.monster img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
@keyframes bob{50%{transform:translateY(-6px)}}
.monster.hit{animation:hit .28s}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-10px);filter:brightness(3)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}}
.monster.dead{animation:dead .8s .05s forwards}
@keyframes dead{0%{opacity:1;filter:brightness(5)}25%{opacity:1;filter:brightness(7);transform:scale(1.08)}100%{transform:scale(1.25);opacity:0;filter:brightness(8) blur(8px)}}
.monster.lunge{animation:lunge .65s}
@keyframes lunge{45%{transform:scale(1.4) translateY(26px)}}
.monster.pre{opacity:0;animation:none}
.monster.spawn{animation:spawn .75s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes spawn{0%{opacity:0;transform:translateY(26px) scale(.55);filter:brightness(6) blur(4px)}55%{opacity:1;filter:brightness(2.4)}100%{opacity:1;transform:none}}
.summon{position:absolute;left:50%;bottom:2px;width:min(74vw,290px);height:min(74vw,290px);margin-bottom:max(-37vw,-145px);transform:translateX(-50%) translateY(50%) rotateX(72deg);pointer-events:none;opacity:0}
.summon i{position:absolute;inset:0;border-radius:50%;border:3px double #bfe8ff;box-shadow:0 0 18px #6fd0ff,inset 0 0 26px #6fd0ff88}
.summon i:last-child{inset:16%;border:2px dashed #e9f6ff}
.summon.go{animation:sumFade 1.1s ease-out both}
.summon.go i{animation:spin 1.1s linear}
.summon.go i:last-child{animation:spin 1.1s linear reverse}
#battle.boss .summon i{border-color:#ffc0b0;box-shadow:0 0 18px #ff5a4a,inset 0 0 26px #ff5a4a88}
@keyframes sumFade{0%{opacity:0;scale:.3}25%{opacity:1}70%{opacity:1;scale:1}100%{opacity:0;scale:1.15}}
.dmg{position:absolute;z-index:3;font:900 22px var(--f-display);color:#fff;-webkit-text-stroke:1px #0b3a2a;text-shadow:0 0 10px #5dffb0,0 2px 0 #000;pointer-events:none;animation:dmg .8s ease-out forwards;font-variant-numeric:tabular-nums}
.dmg.s{-webkit-text-stroke:1px #4a0f0a;text-shadow:0 0 10px #ff7a66,0 2px 0 #000}
.dmg.n{-webkit-text-stroke:1px #1c2a44;text-shadow:0 0 10px #a9c8ff,0 2px 0 #000}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,0) scale(.5)}18%{opacity:1;transform:translate(-50%,-10px) scale(1.25)}100%{opacity:0;transform:translate(-50%,-54px) scale(1)}}
.fx{position:absolute;inset:0;z-index:13;width:100%;height:100%;pointer-events:none}
/* 進入新一層的橫幅 */
.wave{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:hidden;animation:waveDim 1.45s ease both}
@keyframes waveDim{0%,100%{background:#0000}20%,78%{background:#02040a8c}}
.wave-band{position:absolute;left:0;right:0;top:calc(36% - 60px);height:120px;background:linear-gradient(90deg,transparent,#fff3 50%,transparent) 0 0/40% 100% no-repeat,linear-gradient(transparent,#04060ee6 16%,#0a0d1cf2 50%,#04060ee6 84%,transparent);border-block:1px solid #f8e2a0aa;box-shadow:0 0 30px #000;animation:waveBand 1.45s cubic-bezier(.2,.8,.2,1) both}
@keyframes waveBand{0%{transform:scaleY(0);background-position:-40% 0,0 0}16%{transform:scaleY(1)}84%{transform:scaleY(1);background-position:140% 0,0 0}100%{transform:scaleY(0);background-position:140% 0,0 0}}
.wave-txt{position:absolute;left:0;right:0;top:calc(36% - 60px);height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;animation:waveTxt 1.45s cubic-bezier(.2,.8,.2,1) both}
@keyframes waveTxt{0%{opacity:0;transform:translateX(-70%) skewX(-20deg);filter:blur(8px)}22%{opacity:1;transform:translateX(-2%);filter:blur(0)}76%{opacity:1;transform:translateX(3%);filter:blur(0)}100%{opacity:0;transform:translateX(70%) skewX(-20deg);filter:blur(8px)}}
.wave-txt b{font:900 clamp(34px,11vw,50px)/1.1 var(--f-title);letter-spacing:.18em;padding-left:.18em;background:linear-gradient(180deg,#fffdf4 0%,#ffe9ae 32%,#e2a93c 52%,#7a4c12 55%,#e9b85a 74%,#fff3c8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #1b0f03) drop-shadow(0 0 14px #ffb84a99)}
.wave-txt span{font:800 13px var(--f-display);letter-spacing:.5em;padding-left:.5em;color:#f3dca0;text-shadow:0 1px 2px #000}
.wave.boss .wave-txt b{background:linear-gradient(180deg,#fff0ea 0%,#ffb09c 32%,#e2482c 52%,#6a1208 55%,#f0705a 74%,#ffd9cf 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 #2a0503) drop-shadow(0 0 16px #ff3a2acc)}
.wave.boss .wave-band{border-block-color:#ff7a66cc}
.wave.boss .wave-txt span{color:#ffc4b8}
.claw{position:absolute;inset:0;pointer-events:none;opacity:0}
.claw.go{animation:claw .7s}
@keyframes claw{25%{opacity:1;box-shadow:inset 0 0 90px 24px #ff2a2a99}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.pop{position:absolute;left:50%;top:42%;font:900 32px var(--f-display);pointer-events:none;white-space:nowrap;animation:pop 1.4s forwards}
.pop.good{color:var(--gold-hi);text-shadow:0 2px 0 #000,0 0 18px #ffcf5a}
.pop.bad{color:#ff6b5e;text-shadow:0 2px 0 #000}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-150%)}}
.spark{position:absolute;left:50%;top:55%;width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff6c8,#e0a530);box-shadow:0 0 8px #ffcf5a;pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

.chart-card{margin:10px 12px 0;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.chart-head{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sym{font:900 14px var(--f-title);min-width:0}
.sym small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.tabs{display:flex;background:#000a;border-radius:6px;padding:3px;box-shadow:inset 0 0 0 1px #5a3c14;flex:none}
.tabs button{border:0;background:none;padding:4px 12px;border-radius:4px;font:800 12px var(--f-display);color:var(--muted)}
.tabs button.on{background:linear-gradient(#f2d28a,#b8862f 55%,#7a5220);color:#1a1408}
#chart{position:relative;width:100%;height:clamp(190px,30vh,300px);display:block}
.chart-foot{position:relative;font-size:11.5px;line-height:1.5;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr .82fr 1fr;gap:8px;padding:12px}
.act{position:relative;border:0;border-radius:8px;padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font:900 22px var(--f-title);letter-spacing:.12em;color:#fff;text-shadow:0 2px 0 #0007;box-shadow:inset 0 -5px 0 #0006,inset 0 2px 0 #fff5,0 0 0 2px #0008,0 0 0 4px #c99232,0 6px 12px #000a}

.act.flat{font-size:17px;letter-spacing:.06em;background:radial-gradient(ellipse at 50% 0%,#e6eefaaa,transparent 60%),linear-gradient(#6c7a90,#2c3646)}

.streak span{font:700 11px var(--f-title);color:var(--muted)}
.pips{display:flex;gap:4px}
.pips i{width:9px;height:9px;transform:rotate(45deg);background:#2a2015;box-shadow:inset 0 0 0 1px #8a5f22}
.pips i.on{background:linear-gradient(135deg,#fff3c0,#e0a530);box-shadow:0 0 8px #ffc65a}
.streak.hot{animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{box-shadow:inset 0 0 0 1px #ffd26a,0 0 16px #ff9a3a}}
.monster.dodge{animation:dodge .8s}
@keyframes dodge{30%{transform:scale(1.3) translateY(18px)}55%{transform:translateX(-40px) rotate(-8deg)}100%{transform:none}}
.bonus-row{position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,#f2c25a33,#f2c25a08);box-shadow:inset 0 0 0 1px #c99232;font:700 13px var(--f-title)}
.bonus-row b{font:900 16px var(--f-display);color:var(--gold-hi)}
.flat-t{color:#b9c6d8}
.rules{display:grid;gap:10px;font-size:13.5px;line-height:1.7}
.rules h3{margin:6px 0 0;font:900 15px var(--f-title);color:var(--gold-hi);letter-spacing:.06em}
.rules p{margin:0}
.rules ul:not(.titles){margin:0;padding-left:1.2em;display:grid;gap:4px}
.act:disabled{filter:grayscale(.75) brightness(.6);cursor:default}
.act.picked{filter:none;outline:3px solid var(--gold-hi);outline-offset:4px}
.result{margin:0 12px 16px;padding:14px;border-radius:10px;display:grid;gap:12px}
.verdict{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.verdict h3{margin:0;font:900 22px var(--f-title)}
.verdict .amt{font:900 22px var(--f-display);font-variant-numeric:tabular-nums}
.good-t{color:var(--long)} .bad-t{color:var(--short)}
.facts{position:relative;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.row{position:relative;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:6px;padding:12px;font:900 14px var(--f-title);letter-spacing:.08em}
.btn.gold{background:linear-gradient(#fff0bf,#e0b04f 45%,#9a6a22);color:#2a1806;box-shadow:inset 0 -3px 0 #0005,inset 0 1px 0 #fff8,0 0 0 1px #3a260c,0 3px 8px #000a}
.btn.dim{background:linear-gradient(#2c2416,#120e08);color:var(--ink);box-shadow:inset 0 0 0 1px #8a5f22}
.btn:disabled{opacity:.55;cursor:default}

#battle .chart-card{margin:6px 14px 0;padding:14px 12px 10px}
#battle .sym{font-size:15px;color:#ffe9ae;text-shadow:0 1px 0 #0b1436}
#battle .sym small{color:#dbe5ff}
#battle .chart-head .ghost{background:#0b143688;box-shadow:inset 0 0 0 1px #a9c8ff99;border-radius:8px;padding:4px 9px}

#battle .actions{padding:16px 12px 14px;gap:10px;grid-template-columns:repeat(3,1fr);align-items:stretch}
#battle .act,#battle .act.flat{font-size:21px;letter-spacing:.08em;padding:12px 4px;justify-content:center;white-space:nowrap}
#battle .act small{font-size:11px;letter-spacing:.04em}
#battle .act{border-radius:12px;box-shadow:inset 0 -5px 0 #0005,inset 0 2px 0 #fff6,inset 0 0 0 1.5px #ffffff55,0 0 0 2px #7a5220,0 0 0 4px #f0c866,0 0 0 5px #7a5220,0 0 14px #ffe9ae77,0 6px 12px #0a143499}

#battle .result{margin:0 14px 18px}
#battle .facts dt{color:#c3d2f5}
#battle .btn.dim{background:#0b143688;color:#fff;box-shadow:inset 0 0 0 1.5px #a9c8ff}
#battle .btn.gold{background:linear-gradient(#fff3c4,#e8bd5a 50%,#b8862f);color:#1b2550;box-shadow:inset 0 0 0 1px #fff8,0 0 0 1px #7a5220,0 3px 8px #0a143488}
.plaque{width:min(300px,80vw);aspect-ratio:3;margin:-4px 0 0;padding:0 0 1.5%;border-radius:0;background:center/100% 100% no-repeat;box-shadow:none;font-size:17px;color:#3a2a12;text-shadow:0 1px 0 #fff;filter:drop-shadow(0 4px 6px #0006)}
.plaque::before,.plaque::after{display:none}
.plaque:active{filter:brightness(1.06) drop-shadow(0 4px 6px #0006)}
/* ===== 開場：星空之門 ===== */
#title{background:linear-gradient(#070b1f,#131a42 55%,#2a2858)}
#title canvas,#title .hero{display:none}
.t-scene{position:absolute;left:0;right:0;bottom:0;height:calc(min(100vw,480px) * 1.7768);background:center/100% 100% no-repeat;transform-origin:50% 40%;animation:tSceneIn 2.6s cubic-bezier(.2,.7,.2,1) both;-webkit-mask-image:linear-gradient(transparent 0,#000 7%);mask-image:linear-gradient(transparent 0,#000 7%)}
@keyframes tSceneIn{from{transform:scale(1.22);filter:brightness(1.8) blur(3px);opacity:0}35%{opacity:1}to{transform:none;filter:none;opacity:1}}
#title .t-center{top:calc(100% - min(100vw,480px) * 1.7768 * .6)}
#title .t-center::before{content:"";position:absolute;inset:-28px -10px;z-index:-1;background:radial-gradient(ellipse 62% 58% at 50% 50%,#0c1236e0,#0c1236a6 50%,transparent 80%);pointer-events:none}
#title.entered .t-center{top:5%}
#title.entered .t-center::before{opacity:0}
.gate-card.gild{--ink:#fff;--muted:#d9d3f2;--gold-hi:#ffe9ae;--gold:#f3d58a;color:#fff;border:0;border-radius:18px;padding:18px 16px;background:linear-gradient(165deg,#2a2466d9,#1a1a52e0 50%,#12143fe6);background-blend-mode:normal;-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);box-shadow:inset 0 0 0 1px #f3d58acc,inset 0 0 0 4px #0c123655,inset 0 0 30px #8f7bff33,0 0 22px #ffd98a44,0 12px 30px #070b1f99}
.gate-card.gild::before{inset:5px;border:1px solid #f3d58a44;border-radius:14px}
.gate .seg{background:#0c123699;box-shadow:inset 0 0 0 1px #f3d58a77;border-radius:999px;padding:4px}
.gate .seg button{border-radius:999px;color:#d9d3f2}
.gate .seg button.on{background:linear-gradient(#fff3c4,#f0c877 55%,#d9a24e);color:#2a2258;box-shadow:0 0 10px #ffd98a88}
.gate .form label{color:#e6e0fa}
.gate .form input{background:#0c1236aa;box-shadow:inset 0 0 0 1px #b9a8ff88;border-radius:10px;color:#fff}
.gate .form input::placeholder{color:#a9a3cc}
.gate .form input:focus{outline:2px solid #f3d58a;box-shadow:inset 0 0 0 1px #f3d58a,0 0 12px #ffd98a55}
.gate .btn{border-radius:999px}
.gate .btn.gold{background:linear-gradient(#fff3c4,#f0c877 50%,#d9a24e);color:#2a2258;box-shadow:inset 0 0 0 1px #fff8,0 0 16px #ffd98a77,0 4px 10px #070b1f88}
.gate .linkish{color:#ffe9ae}
.gate .err{color:#ffb3ab}
#title .tap{top:auto;bottom:calc(9% + env(safe-area-inset-bottom,0px));background:#0c1236b3;box-shadow:inset 0 0 0 1px #f3d58aaa,0 0 16px #ffd98a55;color:#fff3d0}
.title-screen.entered .t-scene{filter:brightness(.55);transition:filter .8s}
@media (prefers-reduced-motion:reduce){.t-scene{animation:none}}
/* ===== 主畫面：星空之門 ===== */
#app{--w:min(100vw,480px);--ih:calc(var(--w) * 1.7768)}
.map{background:linear-gradient(#070b1f,#131a42 55%,#2a2858)}
.map canvas{display:none}
.scene{position:absolute;left:0;right:0;bottom:0;height:var(--ih);background:center/100% 100% no-repeat}
.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12.5% 7.6%,#161d48 0,#161d48 9.5%,transparent 15%),radial-gradient(ellipse 30% 5% at 78% 5.2%,#12183f 0,#12183fee 60%,transparent 100%),linear-gradient(#131a42 0,#151b45 6.5%,#1a1f4a00 10.5%)}
.scene-glow{position:absolute;left:50%;top:37.8%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff8d8cc 0,#ffe9a866 22%,#9fc4ff22 48%,transparent 70%);mix-blend-mode:screen;animation:sceneGlow 3.6s ease-in-out infinite}
@keyframes sceneGlow{50%{opacity:.45;transform:translate(-50%,-50%) scale(1.25)}}
.scene-stars{position:absolute;inset:0 0 auto 0;height:34%;background:radial-gradient(1.5px 1.5px at 8% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 22% 62%,#ffe9ae,transparent),radial-gradient(1.6px 1.6px at 37% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 44%,#cfe0ff,transparent),radial-gradient(1.6px 1.6px at 68% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 81% 55%,#ffe9ae,transparent),radial-gradient(1.5px 1.5px at 93% 26%,#fff,transparent),radial-gradient(1px 1px at 46% 78%,#fff,transparent),radial-gradient(1px 1px at 14% 86%,#cfe0ff,transparent);animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.scene-glow,.scene-stars{animation:none}}
.topbar{padding:12px 14px 0;align-items:center}
#meFrame{width:auto;max-width:54vw;aspect-ratio:auto;background:none!important;filter:none;display:flex;align-items:center;gap:10px}
#meFrame .av-wrap{position:relative;left:auto;top:auto;transform:none;width:58px;height:58px;flex:none}
#meFrame .av-wrap::after{content:"✦";position:absolute;left:-5px;top:42%;font-size:11px;color:#ffe9ae;text-shadow:0 0 6px #ffd26a}
#meFrame .avatar{border-radius:50%;box-shadow:0 0 0 1.5px #f3d58a,0 0 0 4px #0c1236aa,0 0 0 5px #f3d58a66,0 0 14px #ffd98a66;background:#1b2250}
#meFrame .me-side{position:static;height:auto;display:block;min-width:0}
#meFrame .me-row .name{display:block;font:700 16px var(--f-title);letter-spacing:.06em;color:#fff3d0;text-shadow:0 1px 3px #0b1436;padding-bottom:6px;border-bottom:1.5px solid #f3d58a;min-width:84px;max-width:100%}
.wallet{width:auto;aspect-ratio:auto;margin:0;background:#0c123699!important;filter:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 4px;border-radius:999px;box-shadow:inset 0 0 0 1px #f3d58aaa,0 0 10px #0b143688}
.wallet .wu{position:static;transform:none;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:900 13px var(--f-display);color:#6a430c;text-shadow:none;background:radial-gradient(circle at 35% 30%,#fff6cf,#f0c25a 45%,#b97a1f);box-shadow:inset 0 0 0 1.5px #fbe6a4,0 0 8px #ffd26a88}
.wallet b{position:static;height:auto;display:block;font:600 15px var(--f-display);color:#fff7e0;text-shadow:none;letter-spacing:.02em}
.wallet .wplus{position:static;transform:none;width:22px;height:22px;font:400 20px/1 var(--f-display);color:#fff3d0}
.demo-bar{margin:10px 14px 0;background:#0c123699;box-shadow:inset 0 0 0 1px #f3d58a66;color:#e9e3f5}
.help-btn{margin:10px 14px 0 0;width:34px;height:34px}
.help-btn::before{display:none}
.help-btn span{inset:0;font:600 17px var(--f-display);color:#fff3d0;background:#0c123699;box-shadow:inset 0 0 0 1px #f3d58aaa}
.ticker{height:34px;margin:-34px 58px 0 14px;background:#0c123699;box-shadow:inset 0 0 0 1px #f3d58aaa}
#tkTxt{font-weight:600;color:#fff3d0}
.plaque{width:auto;aspect-ratio:auto;margin:10px 0 0;padding:5px 20px 6px;border-radius:999px;background:#0c123699!important;box-shadow:inset 0 0 0 1px #f3d58aaa;filter:none;font:700 14px var(--f-title);letter-spacing:.14em;color:#fff3d0;text-shadow:none}
.plaque:active{filter:brightness(1.2)}
.fill,.fill2,.gem{display:none}
.enter,.enter.boss{position:absolute;z-index:2;left:50%;bottom:calc(var(--ih) * .515);width:calc(var(--w) * .34);height:calc(var(--ih) * .05);aspect-ratio:auto;transform:translateX(-50%);padding:0;border-radius:999px;background:linear-gradient(#5b4a86f2,#3b3170f2)!important;box-shadow:inset 0 0 0 1.5px #f3d58a,0 0 14px #ffd98a88;filter:none;font:700 clamp(15px,calc(var(--w) * .05),22px) var(--f-title);letter-spacing:.14em;color:#fff3d0;text-shadow:0 0 8px #ffd98a}
.enter.boss{background:linear-gradient(#8a2a44f2,#541430f2)!important}
.enter.art-txt{background:none!important;box-shadow:none}
.enter:active{transform:translateX(-50%) scale(.96)}
.enter.art-txt::after{content:"";display:block;position:absolute;inset:-6px -10px;border-radius:999px;box-shadow:0 0 18px #ffe9ae99,inset 0 0 12px #ffe9ae55;animation:twinkle 2.4s ease-in-out infinite}
.dock{position:absolute;z-index:2;left:0;right:0;bottom:0;height:calc(var(--ih) * .135);padding:0 3%;gap:0;grid-template-columns:1fr 1fr 1fr 1fr}
.dock-btn{max-width:none;width:100%;height:100%;aspect-ratio:auto;background:none!important;filter:none;border-radius:16px}
.dock-btn em{opacity:0}
.dock-btn:active{background:radial-gradient(circle,#ffe9ae44,transparent 65%)!important;transform:none}

.hero-pick{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 18px;text-align:center;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,#1c2c58f5,#070b1cfa)}
.hero-pick h2{margin:0;font-size:26px;letter-spacing:.12em;color:#f6e3a6;text-shadow:0 2px 10px #000}
.hp-k{margin:0;font-size:11px;letter-spacing:.34em;color:#d9ac4a}
.hp-s{margin:0 0 8px;font-size:13px;color:#c9d2ea}
.hp-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:380px}
.hp-card{padding:0 0 10px;border-radius:14px;overflow:hidden;border:2px solid #6b5a34;background:#101833;color:#e9e3d0;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s,opacity .15s}
.hp-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.hp-card b{display:block;margin-top:9px;font-size:16px;letter-spacing:.2em}
.hp-list:has(.on) .hp-card:not(.on){opacity:.5}
.hp-card.on{border-color:#ffd772;transform:translateY(-4px);box-shadow:0 0 0 2px #fff3c4,0 0 26px #ffcf5a99}
.hp-card:focus-visible,.hp-go:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hp-go{margin-top:14px;min-width:230px;padding:14px 22px;border-radius:999px;border:2px solid #fff0bf;background:linear-gradient(#f3cf6a,#b8842a);color:#2a1a04;font:inherit;font-weight:800;font-size:16px;letter-spacing:.1em;cursor:pointer;box-shadow:0 6px 16px #0008}
.hp-go:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.warning{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:24px;text-align:center;background:radial-gradient(ellipse at center,#4a0808f2,#0a0000fa)}
.warning::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#ff2a2a33,transparent 60%);animation:alarm 1s ease-in-out infinite;pointer-events:none}
@keyframes alarm{50%{opacity:.2}}
.hazard{position:relative;height:30px;background:repeating-linear-gradient(-45deg,#ff2b2b 0 16px,#1a0000 16px 32px);background-size:45.25px 45.25px;animation:haz 1s linear infinite;box-shadow:0 0 18px #ff000088}
@keyframes haz{to{background-position:45.25px 0}}
.warn-in{position:relative;display:grid;gap:12px;padding:0 20px}
.warn-word{font:900 clamp(40px,13vw,64px) var(--f-display);color:#ff3b3b;letter-spacing:.14em;text-shadow:0 0 26px #ff0000cc,0 3px 0 #300;animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.warn-sub{font:900 22px var(--f-title);letter-spacing:.08em}
.warn-event{font:700 16px var(--f-title);color:var(--gold-hi)}
.warn-note{margin:0 auto;max-width:30em;font-size:13.5px;line-height:1.7;color:#f2d8d0}

/* 面板 */
.sheet{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;background:#000c}
.sheet-card{width:100%;max-height:88%;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{margin:0;font:900 21px var(--f-title);letter-spacing:.12em}
.x{width:34px;height:34px;border-radius:50%;border:0;background:#0007;box-shadow:inset 0 0 0 1px #8a5f22;font-size:16px}
#sheetBody{position:relative}
.seg{display:flex;gap:6px;margin-bottom:12px;background:#000a;padding:4px;border-radius:8px;box-shadow:inset 0 0 0 1px #3a2a14}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:5px;font:900 14px var(--f-title);color:var(--muted)}
.seg button.on{background:linear-gradient(#f2d28a,#b8862f 55%,#7a5220);color:#1a1408}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:linear-gradient(90deg,#ffffff0c,#ffffff04);box-shadow:inset 0 0 0 1px #ffffff12}
.lb li.me{box-shadow:inset 0 0 0 1px var(--gold);background:linear-gradient(90deg,#d4a44630,#d4a4460a)}
.rk{font:900 17px var(--f-display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.rk.r1{color:#ffd76a;text-shadow:0 0 10px #ffb84a}.rk.r2{color:#e4eaf0}.rk.r3{color:#dca274}
.nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{font-size:11px;color:var(--muted)}
.val{font:800 15px var(--f-display);font-variant-numeric:tabular-nums;text-align:right;color:var(--gold-hi)}
.val small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.hint{font-size:12.5px;line-height:1.6;color:var(--muted);margin:10px 0 0}
.titles{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.titles li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;background:#ffffff06;box-shadow:inset 0 0 0 1px #ffffff12}
.titles li.got{box-shadow:inset 0 0 0 1px var(--gold-lo)}
.titles li.cur{box-shadow:inset 0 0 0 1px var(--gold-hi);background:#d4a44626}
.titles .tn{font:900 15px var(--f-title)}
.titles li:not(.got) .tn{color:var(--dim)}
.titles .tv{font:700 12px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.now-title{display:grid;gap:8px;margin-bottom:14px;padding:12px;border-radius:8px;background:#0007;box-shadow:inset 0 0 0 1px var(--gold-lo)}
.now-title b{font:900 24px var(--f-title);letter-spacing:.1em}
.meter{height:8px;border-radius:2px;background:#000a;overflow:hidden;box-shadow:inset 0 0 0 1px #3a2a14}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#8a5f22,#f8e2a0)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{padding:10px;border-radius:6px;background:#ffffff08;box-shadow:inset 0 0 0 1px #ffffff12}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.form input{width:100%;padding:11px 12px;border-radius:6px;border:0;box-shadow:inset 0 0 0 1px #6e4b1e,inset 0 2px 6px #000;background:#0a0805;color:var(--ink);font:500 15px var(--f-body)}
.form input:focus{outline:2px solid var(--gold);outline-offset:0}
.err{color:#ff8f85;font-size:13px;min-height:1.2em;margin:0}
.linkish{background:none;border:0;padding:0;color:var(--gold-hi);text-decoration:underline;font-size:13px;justify-self:start}
.code{display:flex;gap:8px;align-items:center;margin:12px 0}
.code input{flex:1;min-width:0;padding:11px 12px;border-radius:6px;border:1px dashed var(--gold);background:#0009;color:var(--gold-hi);font:600 15px var(--f-body)}
.big-plus{font:900 36px var(--f-display)}
.toast{position:absolute;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:6px;background:#000e;box-shadow:inset 0 0 0 1px #8a5f22,0 6px 16px #000;font-size:13.5px;line-height:1.5;text-align:center}

/* 開場 */
.title-screen{position:absolute;inset:0;z-index:40;overflow:hidden;background:linear-gradient(#12235e,#3f68b8 38%,#9db9e6 62%,#f3dcb4 82%,#fff6e4);cursor:pointer;-webkit-tap-highlight-color:transparent}
.title-screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.t-center{position:absolute;left:0;right:0;top:22%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;transition:transform .9s cubic-bezier(.3,.7,.2,1),top .9s cubic-bezier(.3,.7,.2,1),opacity .6s}
.logo{position:relative;margin:0;font:900 clamp(30px,9.6vw,48px)/1.15 var(--f-display);letter-spacing:.03em;white-space:nowrap;
  background:linear-gradient(105deg,transparent 40%,#ffffffcc 48%,transparent 56%) 220% 0/250% 100% no-repeat,linear-gradient(180deg,#fffdf4 0%,#ffe9ae 30%,#e2a93c 50%,#7a4c12 53%,#e9b85a 72%,#fff3c8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #2a1806;
  filter:drop-shadow(0 3px 0 #1b0f03) drop-shadow(0 0 18px #000a) drop-shadow(0 0 26px #ffb84a88);opacity:0;animation:slam .7s 1s cubic-bezier(.3,1.4,.4,1) forwards,shine 3.2s 2s ease-in-out infinite}
@keyframes slam{from{opacity:0;transform:scale(2.4);filter:blur(10px)}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:220% 0,0 0}55%,100%{background-position:-120% 0,0 0}}
.logo-pre{display:flex;align-items:center;gap:10px;margin-bottom:-4px;font:700 clamp(11px,3.3vw,15px) var(--f-display);letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;white-space:nowrap;color:#ffe9ae;text-shadow:0 1px 2px #000,0 0 10px #000,0 0 14px #ffb84a88;opacity:0;animation:fade .8s .6s forwards}
.logo-pre i{width:22px;height:1px;background:linear-gradient(90deg,transparent,#ffe9ae)}.logo-pre i:last-child{transform:scaleX(-1)}
.logo-sub{display:flex;align-items:center;gap:12px;font:700 clamp(12px,3.4vw,15px) var(--f-title);letter-spacing:.3em;padding-left:.3em;white-space:nowrap;color:#fff3d0;text-shadow:0 1px 3px #000,0 0 10px #000;opacity:0;animation:fade .8s 1.6s forwards}
.logo-sub span{width:34px;height:1px;background:linear-gradient(90deg,transparent,#fff3d0,transparent)}
.hero{position:absolute;left:50%;bottom:-1%;width:min(96vw,430px);transform:translateX(-50%);opacity:0;animation:heroIn 1.6s .2s ease-out forwards;transition:opacity .5s}
.hero img{position:relative;width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;filter:brightness(1.02) saturate(1.05) drop-shadow(0 6px 14px #0006) drop-shadow(0 0 10px #fff3d066);animation:heroIdle 4.5s ease-in-out infinite;-webkit-mask-image:linear-gradient(#000 88%,transparent 99%);mask-image:linear-gradient(#000 88%,transparent 99%)}
.hero-shadow{position:absolute;left:6%;right:6%;bottom:3%;height:11%;border-radius:50%;background:radial-gradient(ellipse,#3a260c99 0%,#3a260c44 45%,transparent 72%)}
@keyframes heroIn{from{opacity:0;transform:translateX(-50%) translateY(46px) scale(1.1)}to{opacity:1;transform:translateX(-50%)}}
@keyframes heroIdle{50%{transform:translateY(-3px)}}
.tap{position:absolute;left:50%;top:53%;transform:translateX(-50%);border:0;background:#06091acc;box-shadow:inset 0 0 0 1px #f8e2a066,0 4px 18px #000a;border-radius:999px;padding:10px 22px 10px 28px;font:900 16px var(--f-title);letter-spacing:.4em;color:#fff7dc;text-shadow:0 0 12px #ffbf4a;opacity:0;animation:fade .6s 2.1s forwards,breathe 1.8s 2.7s ease-in-out infinite;white-space:nowrap}
@keyframes breathe{50%{opacity:.45}}
@keyframes fade{to{opacity:1}}
.t-foot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font:600 11px var(--f-display);letter-spacing:.2em;color:#ffffff55}
.tflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .9s 1.15s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.75}100%{opacity:0}}
.title-screen.entered{cursor:default}
.title-screen.entered .t-center{top:9%;transform:translateY(-28%) scale(.72)}
.title-screen.entered .hero{opacity:0!important}
.title-screen.entered .tap,.title-screen.entered .t-foot{display:none}
.title-screen.leave{animation:leave .8s forwards}
@keyframes leave{0%{filter:none}30%{filter:brightness(2.5)}100%{opacity:0;filter:brightness(3)}}
.gate{position:absolute;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));pointer-events:none}
.gate-card{width:100%;max-width:420px;max-height:70%;overflow-y:auto;padding:18px 16px;border-radius:12px;pointer-events:auto;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
.gate-card #gateBody{position:relative}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== 試煉畫面：金框素材 ===== */
#battle .b-top{display:grid;grid-template-columns:23% 41% 28%;justify-content:space-between;align-items:center;padding:6px 6px 0}
#battle .ghost#bExit{background:var(--sp-back) center/100% 100% no-repeat;box-shadow:none;border:0;border-radius:0;aspect-ratio:235/115;padding:0;display:grid;place-items:center;font-size:clamp(12px,3.6vw,15px);color:#fff}
#battle .b-floor,#battle .b-floor.boss{background:var(--sp-title) center/100% 100% no-repeat;box-shadow:none;border:0;border-radius:0;aspect-ratio:425/165;padding:0 0 1%;display:grid;place-items:center;font-size:clamp(15px,4.6vw,20px);color:#ffe9ae}
#battle .b-floor.boss{color:#ffb3a8;font-size:clamp(12px,3.6vw,16px)}
#battle .b-bal{background:var(--sp-bal) center/100% 100% no-repeat;box-shadow:none;border:0;border-radius:0;aspect-ratio:280/115;padding:0 9% 0 36%;justify-content:center;font-size:clamp(12px,3.6vw,15px)}

#battle .b-bal{position:relative}

#battle .m-name{font-size:clamp(11px,3.3vw,14px)}

#battle .streak{background:var(--sp-streak) center/100% 100% no-repeat;box-shadow:none;border:0;border-radius:0;top:calc((100vw - 8px) * .104 + 2px);right:4px;width:31%;aspect-ratio:315/92;padding:0;justify-content:center;gap:6px}

#battle .stage{padding-top:0}
#battle .chart-card.gild{background:var(--sp-chart) center/100% 100% no-repeat;box-shadow:none;border:0;border-radius:0;position:relative;display:block;margin:0 4px;padding:0;aspect-ratio:1015/720;-webkit-backdrop-filter:none;backdrop-filter:none}
#battle .chart-card.gild::before{display:none}
#battle .chart-head{position:absolute;left:17%;right:7.6%;top:9%;height:17.5%}
#battle .sym{font-size:clamp(12px,3.5vw,15px);line-height:1.25}#battle .sym small{font-size:clamp(9px,2.6vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#battle .sym{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#battle #chart{position:absolute;left:7.3%;top:28.6%;width:85.6%;height:67%;border-radius:10px;background:#081240d1}
#battle .chart-foot{background:var(--sp-text) center/100% 100% no-repeat;box-shadow:none;border:0;border-radius:0;margin:-2px 8px 0;padding:5.2% 8% 5.6%;font-size:clamp(11px,3.1vw,12.5px);line-height:1.55;color:#f1f3ff}
#battle .actions{gap:0;padding:2px 2px 10px;grid-template-columns:repeat(3,1fr)}
#battle .act,#battle .act.flat,#battle .act.long,#battle .act.short{background:center/100% 100% no-repeat;box-shadow:none;border-radius:0;aspect-ratio:520/303;padding:0;font-size:clamp(17px,5.2vw,22px)}
#battle .act.long{background-image:var(--sp-bl)}#battle .act.flat{background-image:var(--sp-bm)}#battle .act.short{background-image:var(--sp-br)}
#battle .act small{font-size:clamp(9px,2.7vw,11px)}
#battle .act.picked{outline:0;filter:drop-shadow(0 0 8px #ffe9ae) brightness(1.15)}
#battle .lots{margin:6px 14px 0}
/* 戰鬥畫面一屏放完：怪物區吃剩下的高度，盤面高度有上限 */
#battle .stage{flex:1 1 0;height:auto;min-height:118px;padding:0 16px 6px}
#battle .monster,#battle .monster.boss{height:min(100% - 34px,min(60vw,240px));width:auto;aspect-ratio:1;margin-bottom:-4px}
#battle .monster.boss{height:min(100% - 26px,min(70vw,285px))}
#battle .stage::before{width:min(52vw,220px);height:22px;bottom:4px}
#battle .chart-card.gild{flex:none;aspect-ratio:auto;height:min(calc((min(100vw,480px) - 8px) * .709),35vh)}
#battle .chart-foot{flex:none;padding:4.4% 8% 4.8%;line-height:1.45}
#battle .lots{flex:none;margin:2px 14px 0;padding:5px 12px}
#battle .lots-seg button{padding:5px 8px}
#battle .actions{flex:none;padding:0 2px 6px}
#battle .result{flex:none}
#battle .chart-foot{display:none}
#battle .b-floor,#battle .b-floor.boss{padding:3.5% 0 0 .06em;line-height:1}
#battle .b-bal{padding:1% 11% 0 39%;line-height:1}
#battle .b-bal::before{left:26.5%;transform:translate(-50%,-46%)}
#battle .ghost#bExit{padding-top:1%;line-height:1}
.sheet-card.gild{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet:not(.art) #sheetBody{padding:18px 18px 20px}
.sheet .rules{font-size:14px;line-height:1.75}
/* 怪物區固定較矮，盤面吃剩下的高度（金框用九宮格拉伸，上緣標題列不變形） */
#battle{--cw:calc(min(100vw,480px) - 8px)}

#battle .chart-card.gild{flex:1 1 0;height:auto;min-height:calc(var(--cw) * .5);background:none;box-sizing:border-box;border-style:solid;border-color:transparent;border-width:calc(var(--cw) * .183) calc(var(--cw) * .071) calc(var(--cw) * .033);border-image:var(--sp-chart) 134 52 24 52 fill / calc(var(--cw) * .183) calc(var(--cw) * .071) calc(var(--cw) * .033) stretch}
#battle .chart-head{left:calc(var(--cw) * .099);right:calc(var(--cw) * .004);top:calc(var(--cw) * -.122);height:calc(var(--cw) * .108)}

#battle .act,#battle .act.flat,#battle .act.short{padding:0;width:100%;min-width:0}

function totalFloors() { return S.live ? S.total : CONFIG.baseFloors + CONFIG.floorsPerDay * Math.max(0, daysBetween(CONFIG.launchDate, taipeiDate())); }

/* 判定（和出題引擎相同）。A＝題目最後一根 K 的收盤價，P＝該商品的判定點數，C3＝第 3 根的收盤價

   做空：3 根裡最低價碰到 A−P，且 C3 沒有高於 A
   盤整：其餘（上下都沒碰到；或碰到了但 C3 收回 A 的另一邊）
   上下都碰到時，看 C3 在 A 的哪一邊 */
function judgeQ(vis, rev, pts) {

  const hi = Math.max(...rev.map(c => c[1])), lo = Math.min(...rev.map(c => c[2]));

  if (upHit && dnHit) answer = c3 > a ? 'bull' : c3 < a ? 'bear' : 'neutral';
  else if (upHit) answer = c3 >= a ? 'bull' : 'neutral';

  return { answer, finalMove: c3 - a, maxUp: hi - a, maxDown: a - lo };

  let all, j;
  for (let tries = 0; tries < 80; tries++) {
    all = []; let p = A.base * (.9 + r() * .2), trend = 0;
    for (let i = 0; i < 163; i++) {
      if (i % 24 === 0) trend = (r() - .5) * A.vol * .8;
      const fut = i >= 160, v = A.vol * (fut ? (want === 'neutral' ? .35 : boss ? 3.2 : 1.8) : 1) * (.5 + r());
      const o = p, c = o * (1 + (fut && want === 'neutral' ? 0 : trend) + (r() - .5) * 2 * v);
      all.push([o, Math.max(o, c) * (1 + r() * v * .9), Math.min(o, c) * (1 - r() * v * .9), c].map(z => +z.toFixed(A.dp))); p = all[i][3];
    }
    j = judgeQ(all.slice(120, 160), all.slice(160), pts);

  }
  const h1 = [];

function mailTypo(email) {

    if (isAdmin()) {
      body.insertAdjacentHTML('beforeend', `<div class="ac-assets adm"><h3>管理員工具</h3>
        <div class="adm-row"><label for="admN">跳到試煉</label><input id="admN" type="number" inputmode="numeric" min="1" max="${totalFloors()}" value="${Math.min(u.floor + 1, totalFloors())}"><button id="admGo">前往</button></div>
        <div class="adm-row adm-r2"><button id="admRisk" class="adm-alt" aria-pressed="${u.riskTest}">套用風控護盾：${u.riskTest ? '開' : '關'}</button><button id="admFill" class="adm-alt">補滿額度</button></div>
        <div class="adm-row adm-r2"><button id="admStory" class="adm-alt" style="grid-column:1/-1">重看開頭故事</button></div>
        <button id="admReset" class="adm-reset">重置我的關卡紀錄</button><p class="adm-msg" id="admMsg">共 ${totalFloors()} 道試煉。跳關只改進度，本金和戰績不變。</p></div>`);
      const msg = t => { const m = $('#admMsg'); if (m) m.textContent = t; };
      const run = async (patch, done) => { try { const nu = await B.adminSet(patch); if (nu) S.user = nu; S.lotSeen = S.riskSeen = false; renderHome(); done(); } catch (e) { msg('失敗：' + (e.code === 'permission-denied' ? '請先更新 Firestore 規則' : e.message)); } };
      $('#admGo').onclick = () => { const n = Math.floor(+$('#admN').value), t = totalFloors(); if (!(n >= 1 && n <= t)) return msg(`請輸入 1～${t}`); run({ floor: n - 1 }, () => { closeSheet(); toast(`已跳到${trial(n)}，按「進入試煉」開始。`); }); };
      $('#admRisk').onclick = () => run({ riskTest: !u.riskTest }, () => { openSheet('account'); toast(u.riskTest ? '風控護盾：管理員不受限。' : '風控護盾：已套用，和一般玩家一樣會扣額度、會被鎖。'); });
      $('#admStory').onclick = () => { closeSheet(); STORY_P = null; introStory(true); };
      $('#admFill').onclick = () => run({ riskDebt: 0 }, () => { closeSheet(); toast('風控護盾已補滿。'); });
      let armed = false;
      $('#admReset').onclick = () => { if (!armed) { armed = true; $('#admReset').textContent = '再按一次確認重置'; return; }
        run({ floor: 0, balance: CONFIG.start + (u.invites || 0) * CONFIG.invite, peak: CONFIG.start, wins: 0, losses: 0, total: 0, streak: 0, bestStreak: 0, rankBp: -1, riskDebt: 0, checkDay: 0, title: '' }, () => { HIST.put({}); openSheet('account'); toast(`已重置：回到試煉 01、本金 ${fmt(CONFIG.start + (u.invites || 0) * CONFIG.invite)} U${u.invites ? '（含邀請獎勵）' : ''}。`); }); };

    HIST.fill().then(o => { const g = $('#aaGrid'); if (!g || S.sheet !== 'account') return;
      g.innerHTML = ['gold', 'btc', 'nasdaq', 'dow'].map(k => { const [w, t] = o[k]; return `<div class="aa-c"><span>${CONFIG.assetNames[k]}</span><b>${t ? (w / t * 100).toFixed(1) + '%' : '—'}</b><small>${t ? `${w} 勝 ${t - w} 敗` : '尚無紀錄'}</small></div>`; }).join(''); }).catch(() => {});

          if (v === u.name) return er.textContent = '新暱稱和現在的一樣。';
          const go = $('#rnGo'); go.disabled = true;
          try { const nu = await B.rename(v); if (nu) S.user = nu; renderHome(); openSheet('account'); toast('暱稱已更新。'); }
          catch (e) { er.textContent = e.message === 'RENAME_WAIT' ? '暱稱每 14 天只能修改一次。' : '修改失敗：' + e.message; go.disabled = false; }

  $('#sheet').classList.toggle('art', ['account'].includes(kind));

}
function renderAuth(body) {
  const reg = S.authTab === 'register';
  body.innerHTML = `<div class="seg"><button data-t="register" class="${reg ? 'on' : ''}">註冊帳號</button><button data-t="login" class="${reg ? '' : 'on'}">登入</button></div>
    <form class="form" id="authForm" novalidate>
      <label>信箱<input id="fEmail" type="email" autocomplete="email" required></label>
      ${reg ? '<label>暱稱（排行榜顯示）<input id="fName" maxlength="16" required></label>' : ''}
      <label>密碼${reg ? '（至少 6 碼）' : ''}<input id="fPw" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required></label>
      ${reg ? '<label>推薦人信箱（選填，填朋友註冊用的信箱）<input id="fRef" type="email" autocomplete="off"></label>' : ''}
      <p class="err" id="fErr"></p>
      <button class="btn gold" id="fGo" type="submit">${reg ? '註冊並領取 10,000 U' : '登入'}</button>
      ${reg ? '' : '<button type="button" class="linkish" id="fReset">忘記密碼？寄重設信到我的信箱</button>'}
    </form>`;
  body.querySelectorAll('.seg button').forEach(x => x.onclick = () => { S.authTab = x.dataset.t; renderAuth(body); });
  const err = t => ($('#fErr').textContent = t);
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const email = $('#fEmail').value.trim(), pw = $('#fPw').value, name = reg ? $('#fName').value.trim() : '', refEmail = reg ? $('#fRef').value.trim() : '';
    const okMail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
    if (!okMail(email)) return err('請輸入正確的信箱。');
    if (reg && mailTypo(email)) return err('信箱格式有誤');
    if (reg && !name) return err('請輸入暱稱。');
    if (pw.length < 6) return err('密碼至少要 6 個字元。');
    if (refEmail && !okMail(refEmail)) return err('推薦人信箱格式不正確。');
    if (refEmail && refEmail.toLowerCase() === email.toLowerCase()) return err(ERR.REF_SELF);
    const go = $('#fGo'); go.disabled = true; go.textContent = '處理中…'; err('');
    try {
      if (reg) await B.signUp({ email, pw, name, refEmail }); else await B.signIn({ email, pw });
      if (!S.user) await new Promise(r => setTimeout(r, 400));
      enterWorld();
      toast(reg ? (refEmail ? '歡迎加入！10,000 U 已入帳，推薦人也拿到獎勵了。' : '歡迎加入！10,000 U 已入帳。') : `歡迎回來，${S.user ? S.user.name : ''}！`);
    } catch (ex) { err(errMsg(ex)); go.disabled = false; go.textContent = reg ? '註冊並領取 10,000 U' : '登入'; }
  };
  const rs = $('#fReset');
  if (rs) rs.onclick = async () => { const email = $('#fEmail').value.trim(); if (!email) return err('先在上面輸入你的信箱。'); try { await B.resetPw(email); err(''); toast('重設密碼信已寄出，請到信箱收信。'); } catch (ex) { err(errMsg(ex)); } };
}
async function loadBoard() {
  const kind = S.boardKind, list = $('#lb');
  /* 同一個榜 60 秒內重開不重抓，省讀取量 */
  const LB = loadBoard.cache || (loadBoard.cache = {}), hit = LB[kind];
  let rows; try { rows = hit && Date.now() - hit.at < 6e4 ? hit.rows : (LB[kind] = { at: Date.now(), rows: await B.leaderboard(kind) }).rows; } catch (e) { if (list) list.innerHTML = `<li><span></span><span class="nm"><b>排行榜讀取失敗</b><span>${esc(e.message)}</span></span></li>`; return; }
  if (S.sheet !== 'rank' || S.boardKind !== kind || !$('#lb')) return;
  if (!rows.length) { $('#lb').innerHTML = `<li><span></span><span class="nm"><b>還沒有人上榜</b><span>${kind === 'rate' ? `打滿 ${CONFIG.minRankGames} 戰就能上榜` : kind === 'net' ? '邀請第一位好友就能上榜' : '成為第一位挑戰者'}</span></span></li>`; return; }
  const ranked = rows.map((r, i) => [r, i]), mi = S.user ? rows.findIndex(r => r.uid === S.user.uid) : -1;
  const show = ranked;
  $('#lb').innerHTML = show.map(([r, i]) => {
    const me = S.user && r.uid === S.user.uid;
    const v = kind === 'net' ? `${r.invites} 人<small>獎勵 ${fmt(r.invites * CONFIG.invite)} U</small>` : kind === 'rate' ? `${(r.rankBp / 100).toFixed(1)}%<small>${r.wins} 勝 ${r.total - r.wins} 敗</small>` : `${fmt(netOf(r))} U<small>${r.wins || 0} 勝 ${r.losses || 0} 敗</small>`;
    return `<li class="${me ? 'me' : ''} ${i < 3 ? 'top t' + (i + 1) : ''}"><span class="rk ${i < 3 ? 'r' + (i + 1) : ''}"><i>${i + 1}</i></span><span class="nm"><b>${esc(r.name || '交易員')}${me ? '（你）' : ''}</b><span>${esc(me ? myTitle() : shownTitle(r))}</span></span><span class="val">${v}</span></li>`;
  }).join('');
}
function closeSheet() { $('#sheet').hidden = true; S.sheet = null; }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(hideToast, 3200); }
function hideToast() { $('#toast').hidden = true; }

/* ================= 綁定與啟動 ================= */
function bindUI() {
  document.querySelectorAll('#app > [data-act], .dock [data-act]').forEach(x => x.onclick = () => act(x.dataset.act));
  $('#avatar').onclick = () => openSheet('account');
  $('#walletPlus').onclick = () => openSheet('invite');
  $('#btnAccount').onclick = () => openSheet('rules');
  $('#btnNotice').onclick = () => openSheet('notice');
  $('#ticker').onclick = () => openSheet('feed');
  BGM.init();
  $('#sheetClose').onclick = closeSheet;
  $('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
  $('#bExit').onclick = exitBattle;
  $('#bRules').onclick = () => openSheet('rules');
  $('#wBack').onclick = () => { $('#warning').hidden = true; S.pending = null; };
  $('#wGo').onclick = () => { $('#warning').hidden = true; const c = S.pending; S.pending = null; if (c) enterBattle(c); };
  document.querySelectorAll('.act').forEach(x => x.onclick = () => resolveBattle(DIRS[x.dataset.dir]));
  document.querySelectorAll('.tabs button').forEach(t => t.onclick = () => { setTf(t.dataset.tf); drawChart(S.battle ? S.battle.reveal : 0); });
  $('#title').onclick = e => { if (!e.target.closest('.gate')) onTitleTap(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (!$('#warning').hidden) $('#wBack').click(); }
    if ((e.key === 'Enter' || e.key === ' ') && !$('#title').hidden && !$('#title').classList.contains('entered') && document.activeElement === document.body) onTitleTap();
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.battle) drawChart(S.battle.reveal); if (S.entered) mapFrame(performance.now()); }, 120); });
  document.addEventListener('visibilitychange', async () => { if (document.hidden) return; if (S.live) { try { await B.loadTower(); } catch (e) {} } renderHome(); if (S.entered) startMapLoop(); });
}
/* 先鋪一張很小的模糊底圖，大圖整張下載完才淡入，不會由上往下一段一段出現 */
function softBg(el, tiny, src) {
  el.style.backgroundImage = `url(${tiny})`;
  const full = document.createElement('div'); full.className = 'bg-full'; el.prepend(full);
  const im = new Image();
  im.onload = () => { const show = () => { full.style.backgroundImage = `url(${src})`; full.classList.add('on'); }; im.decode ? im.decode().then(show, show) : show(); };
  im.src = src;
}

  $('#sheet').style.backgroundImage = `linear-gradient(#0b123a59,#141d5c40 45%,#0b123a59), url(${OPEN_SRC})`;

  makeGrain(); bindUI(); initMapFx(); startTitle(); $('#tapStart').textContent = '點擊畫面開始';
  S.ready = (async () => {
    renderHome();
    try { await B.init(onUserChanged); S.live = B === FB; }
    catch (e) { console.warn(e); B = LOCAL; S.live = false; S.cloudFailed = true; await LOCAL.init(onUserChanged); }
    renderHome();

}
